{% extends 'mailings/base.html' %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-lg-6 col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow border-end-3 border-bottom-3 border-info border-start-0 border-top-0">
                <h3>Восстановление пароля</h3>
                <p>Забыли пароль? Введите свой адрес электронной почты ниже, и мы вышлем вам инструкцию, как установить
                    новый пароль.</p>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <input type="submit" value="Восстановить пароль">
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
