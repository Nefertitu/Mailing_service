{% extends 'mailings/base.html' %}
{% block content %}
<div class="container">
    <form class="row" method="post" enctype="multipart/form-data">
        <div class="col-lg-6 col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow p-3 border-end-3 border-bottom-3 border-info border-start-0 border-top-0">
                {% if validlink %}
                <h3>Введите новый пароль</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="mt-3 mb-3 btn btn-primary">Изменить пароль</button>
                </form>
                {% else %}
                <h3>Ошибка ссылки</h3>
                <p>Ссылка для сброса пароля недействительна. Запросите новый сброс.</p>
                    <p><a href="{% url 'user:password_reset_custom' %}">Запрос на сброс пароля</a></p>
            </div>
        </div>
    </form>
</div>
{% endif %}
{% endblock %}
