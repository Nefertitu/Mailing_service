{% extends 'mailings/base.html' %}
{% block content %}

<div class="container">
    <form class="row" method="post" enctype="multipart/form-data">
        <div class="col-lg-6 col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow">
                {% if object %}
                <h5 class="fw-light mt-3 mb-2 text-center">Редактировать данные рассылки:</h5>
                <p class="fw-light mb-2 text-center">{{ object.message }}</p>
                {% else %}
                <h5 class="ffw-light mt-3 mb-2 text-center">Добавить рассылку</h5>
                {% endif %}
                <div class="card-body">
                    {% csrf_token %}
                    {{ form.non_field_errors }}
                    {{ form.as_p }}
                    {% if select_all %}
                     <div class="form-check">
        <input type="checkbox" id="select-all" class="form-check-input">
        <label for="select-all" class="form-check-label">Выбрать всех</label>
    </div>
               {% endif %}

                    <button type="submit" class="btn btn-primary">
                        {% if object %}
                        Сохранить изменения
                        {% else %}
                        Добавить рассылку
                        {% endif %}
                    </button>
                    <a class="p-2 btn btn-success" href="{% url 'mailings:mailing_list' %}">Отменить</a>

                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
